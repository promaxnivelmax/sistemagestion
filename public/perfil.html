<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Hoja de vida</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffc21a' stroke='%2310262b' stroke-width='4'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='28' fill='%2310262b'%3EHV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6dc;--card:#fff;--tx:#10262b;--sub:#46616a;--am:#ffc21a;--am2:#ffe38a;--te:#0d7c86;--te2:#d6f0f1;--line:#10262b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 'Nunito',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;letter-spacing:.2px}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 40px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);overflow:hidden}
.card+.card{margin-top:18px}
.pad{padding:18px 18px 16px}
.foto{position:relative;background:linear-gradient(160deg,var(--am) 0%,var(--am) 55%,var(--te) 55.2%);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--line)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .ini{width:46%;aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid var(--line);display:grid;place-items:center;font-family:'Lilita One';font-size:clamp(40px,9vw,64px)}
.nombre{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 12px;background:linear-gradient(transparent,rgba(16,38,43,.85));color:#fff}
.nombre h1{font-size:clamp(24px,4.4vw,32px);line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.dato{display:flex;gap:12px;align-items:flex-start;margin:9px 0;font-weight:600;word-break:break-word}
.dato i{flex:none;width:30px;height:30px;border-radius:9px;background:var(--am2);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:15px}
.dato small{display:block;color:var(--sub);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
hr{border:0;border-top:2px dashed #e3d9b8;margin:14px 0}
.titulo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.titulo span{width:38px;height:38px;flex:none;border-radius:12px;background:var(--am);border:2.5px solid var(--line);display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 var(--line)}
.titulo h2{font-size:23px}
.lado h3{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:800;font-size:13px;background:#fff}
.chip.te{background:var(--te2)}
.barra{margin:8px 0 12px}.barra b{font-size:14px}.barra div{height:14px;border:2px solid var(--line);border-radius:99px;background:#fff;overflow:hidden;margin-top:4px}.barra div i{display:block;height:100%;background:var(--am);border-right:2px solid var(--line)}
.item{padding:14px 0;border-bottom:2px dashed #e3d9b8}.item:last-child{border-bottom:0;padding-bottom:4px}
.item h3{font-size:19px;line-height:1.2}.item .de{font-weight:800;color:var(--sub);margin-top:2px}
.fecha{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:800;color:var(--te);font-size:14px}
.actual{background:var(--te);color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;margin-left:4px}
.perfil{font-size:16px;line-height:1.6}
.bajar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:3px solid var(--line);border-radius:14px;background:var(--am);box-shadow:0 5px 0 var(--line);font:22px 'Lilita One',sans-serif;color:var(--tx);padding:14px 16px;cursor:pointer;text-decoration:none}
.bajar:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.bajar[disabled]{opacity:.6;cursor:wait}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .marca{display:flex;align-items:center;gap:10px;font-family:'Lilita One';font-size:19px}
.top .marca svg{width:36px;height:36px}
.top .grow{flex:1}
.pie{text-align:center;color:var(--sub);font-size:13px;margin-top:26px}
.msg{max-width:520px;margin:12vh auto 0;text-align:center}.msg .card{padding:28px 22px}.msg h1{font-size:30px;margin:8px 0}
.nota{background:var(--te2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:10px}
.cargando{display:inline-block;width:38px;height:38px;border:5px solid var(--am2);border-top-color:var(--te);border-radius:50%;animation:g 1s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
@media print{.bajar,.top .grow,.nopr{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg"><span class="cargando"></span><p style="margin-top:12px">Cargando hoja de vida…</p></div></div>
<script>
(function () {
'use strict';
const SB = 'https://sbuyguoxwgpzsqtyhjaf.supabase.co/rest/v1';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidXlndW94d2dwenNxdHloamFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTEzODUsImV4cCI6MjA5NjE2NzM4NX0.YqZtDO1dBktJQ7Nu-AEBRWIoMGzDZISdcD5x-8z4U_U';
// el Word del enlace lo arma la función hv-enlace (gratis para quien tiene el enlace)
const API = 'https://sbuyguoxwgpzsqtyhjaf.supabase.co/functions/v1/hv-enlace';
const NEGOCIOS = { '52': 'Internet La 52', laura: 'Trámites y Servicios Laura' };
const app = document.getElementById('app');
const token = (new URLSearchParams(location.search).get('t') || location.pathname.split('/').filter(Boolean).pop() || '').replace(/[^A-Za-z0-9_-]/g, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const V = s => String(s == null ? '' : s).trim();
const SIGLAS = /^(SENA|SAS|SA|S\.A\.S\.?|S\.A\.?|LTDA\.?|ICBF|DIAN|UIS|UNAD|ESAP|UNIPAZ|ISMOCOL|ECP|IPS|EPS|ARL|I\.E\.?|E\.S\.P\.?|UT|HSE|SST|SG-SST)$/i;
const MEN = new Set(['de', 'del', 'la', 'las', 'los', 'el', 'y', 'e', 'en', 'a', 'o', 'u', 'para', 'con', 'por', 'al']);
const bonito = s => V(s).replace(/\((A|O|AS|OS)\)/gi, m => m.toLowerCase()).split(/\s+/).map((w, i) => SIGLAS.test(w) ? w.toUpperCase() : (i > 0 && MEN.has(w.toLowerCase()) ? w.toLowerCase() : w.toLowerCase().replace(/(^|[(/-])(\p{L})/gu, (a, b, c) => b + c.toUpperCase()))).join(' ').replace(/\(([AO]S?)\)/g, m => m.toLowerCase());
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MC = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fecha = (s, corta) => { const m = V(s).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/); if (!m) return V(s); return corta ? `${MC[+m[2] - 1]} ${m[1]}` : `${m[3] ? +m[3] + ' de ' : ''}${MESES[+m[2] - 1]} de ${m[1]}`; };
const anio = s => (V(s).match(/(19|20)\d\d/) || [''])[0];
const RANGO = n => ({ Primaria: 1, Secundaria: 2, 'Técnico': 3, 'Tecnólogo': 4, Universitario: 5, Curso: 0 }[n] ?? 0);
const LOGO = t => `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#ffc21a" stroke="#10262b" stroke-width="4"/><path d="M6 42c6-4 11-4 17 0s11 4 17 0 11-4 18 0v6a30 30 0 0 1-52 0z" fill="#0d7c86" stroke="#10262b" stroke-width="3" stroke-linejoin="round"/><text x="32" y="36" text-anchor="middle" font-family="Lilita One,system-ui,sans-serif" font-size="22" fill="#10262b">${t}</text></svg>`;

function error(t, m) {
  document.title = 'Hoja de vida';
  app.innerHTML = `<div class="msg"><div class="card"><div style="font-size:44px">🔒</div><h1>${esc(t)}</h1><p>${esc(m)}</p></div></div>`;
}
async function rpc(fn, args) {
  const r = await fetch(SB + '/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.error)) || 'No se pudo cargar');
  return j;
}
function meses(a, b) { const f = s => { const m = V(s).match(/^(\d{4})(?:-(\d{2}))?/); return m ? (+m[1]) * 12 + (+(m[2] || 1)) - 1 : null; }; const x = f(a), y = b === 'hoy' ? (new Date().getFullYear() * 12 + new Date().getMonth()) : f(b); return x != null && y != null && y >= x ? y - x + 1 : 0; }
function tiempo(n) { if (!n) return ''; const a = Math.floor(n / 12), m = n % 12; return [a ? a + (a === 1 ? ' año' : ' años') : '', m ? m + (m === 1 ? ' mes' : ' meses') : ''].filter(Boolean).join(' y '); }

function pinta(D) {
  const p = D.persona || {}, h = D.hv || {};
  const nombre = bonito(V(p.nombres) + ' ' + V(p.apellidos));
  document.title = nombre + ' · Hoja de vida';
  const exps = (h.experiencias || []).filter(e => V(e.empresa)).slice().sort((a, b) => (b.actual ? '9999' : V(b.fin) || V(b.ingreso)).localeCompare(a.actual ? '9999' : V(a.fin) || V(a.ingreso)));
  const ests = (h.estudios || []).filter(e => V(e.inst) || V(e.titulo)).slice().sort((a, b) => (RANGO(b.nivel) - RANGO(a.nivel)) || V(b.fin).localeCompare(V(a.fin)));
  const refs = [].concat(h.ref_fam || [], h.ref_per || []).filter(r => r && V(r.nombre));
  const titulo = exps.length ? bonito(exps[0].cargo) : ests.length ? bonito(ests[0].titulo) : '';
  const totalMeses = exps.reduce((s, e) => s + meses(e.ingreso, e.actual ? 'hoy' : e.fin), 0);
  const edad = (() => { const m = V(p.fecha_nac).match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return ''; const n = new Date(), a = n.getFullYear() - m[1] - ((n.getMonth() + 1 < +m[2] || (n.getMonth() + 1 === +m[2] && n.getDate() < +m[3])) ? 1 : 0); return a > 0 && a < 100 ? a + ' años' : ''; })();
  const ciudad = bonito(V(p.lugar_res) || V(p.ciudad) || 'Barrancabermeja');
  const nivelAlto = ests.find(e => e.nivel !== 'Curso');
  const cursos = ests.filter(e => e.nivel === 'Curso').length;
  const ini = nombre.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('');
  const neg = NEGOCIOS[D.negocio] || NEGOCIOS['52'];
  const cel = V(p.celular).replace(/\D/g, '');
  const barras = [['Experiencia', exps.length ? Math.max(15, Math.min(100, Math.round(totalMeses / 1.2))) : 0, tiempo(totalMeses) || (exps.length ? exps.length + (exps.length === 1 ? ' empleo' : ' empleos') : 'En búsqueda de su primera oportunidad')], ['Formación', Math.round(Math.max(RANGO(nivelAlto && nivelAlto.nivel), 1) / 5 * 100), nivelAlto && V(nivelAlto.nivel) ? (nivelAlto.nivel === 'Secundaria' ? 'Bachiller' : nivelAlto.nivel) : 'Estudios'], ['Cursos y capacitaciones', Math.min(100, cursos * 20), cursos ? cursos + (cursos === 1 ? ' curso' : ' cursos') : 'Sin cursos registrados']];
  app.innerHTML = `
  <div class="top nopr"><span class="marca">${LOGO(D.negocio === 'laura' ? 'TL' : '52')}<span>Hoja de vida</span></span><span class="grow"></span></div>
  <div class="grid">
    <div class="lado">
      <div class="card">
        <div class="foto">${p.foto ? `<img src="data:image/jpeg;base64,${esc(p.foto)}" alt="Foto de ${esc(nombre)}">` : `<div class="ini">${esc(ini)}</div>`}
          <div class="nombre"><h1>${esc(nombre)}</h1></div></div>
        <div class="pad">
          ${titulo ? `<div class="dato"><i>💼</i><div><small>Perfil</small>${esc(titulo)}</div></div>` : ''}
          <div class="dato"><i>🏠</i><div><small>Ciudad</small>${esc(ciudad)}${V(p.barrio) ? ' · ' + esc(bonito(p.barrio)) : ''}</div></div>
          ${V(p.correo) ? `<div class="dato"><i>✉️</i><div><small>Correo</small><a href="mailto:${esc(V(p.correo).toLowerCase())}" style="color:inherit">${esc(V(p.correo).toLowerCase())}</a></div></div>` : ''}
          ${cel ? `<div class="dato"><i>📱</i><div><small>Celular</small><a href="tel:${esc(cel)}" style="color:inherit">${esc(cel.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3'))}</a></div></div>` : ''}
          ${edad ? `<div class="dato"><i>🎂</i><div><small>Edad</small>${esc(edad)}</div></div>` : ''}
          <hr>
          <h3>⭐ Resumen</h3>
          ${barras.map(([t, v, x]) => `<div class="barra"><b>${esc(t)}</b> <span style="color:var(--sub);font-size:13px;font-weight:700">· ${esc(x)}</span><div><i style="width:${Math.max(6, v)}%"></i></div></div>`).join('')}
          ${V(p.estado_civil) ? `<hr><h3>🪪 Datos</h3><div class="chips"><span class="chip te">${esc(bonito(p.estado_civil))}</span>${V(p.lugar_nac) ? `<span class="chip">Nació en ${esc(bonito(p.lugar_nac))}</span>` : ''}</div>` : ''}
        </div>
      </div>
      <div class="card nopr" style="margin-top:18px"><div class="pad">
        <button class="bajar" id="bajar">⬇️ Descargar en Word</button>
        <p style="color:var(--sub);font-size:13px;margin-top:10px;text-align:center">Siempre sale con la información más reciente.</p>
      </div></div>
    </div>
    <div>
      ${V(h.sin_exp) ? `<div class="card"><div class="pad"><div class="titulo"><span>🙋</span><h2>Sobre mí</h2></div><p class="perfil">${esc(V(h.sin_exp).charAt(0) + V(h.sin_exp).slice(1).toLowerCase())}</p></div></div>` : ''}
      <div class="card"><div class="pad"><div class="titulo"><span>💼</span><h2>Experiencia laboral</h2></div>
        ${exps.length ? exps.map(e => { const t = tiempo(meses(e.ingreso, e.actual ? 'hoy' : e.fin)); return `<div class="item"><h3>${esc(bonito(e.cargo) || 'Cargo')}</h3><div class="de">${esc(bonito(e.empresa))}${V(e.ciudad) ? ' · ' + esc(bonito(e.ciudad)) : ''}</div>
          <div class="fecha">📅 ${esc(fecha(e.ingreso, 1) || '')}${e.ingreso && (e.actual || V(e.fin)) ? ' – ' : ''}${e.actual ? 'hoy <span class="actual">Actual</span>' : esc(fecha(e.fin, 1) || '')}${t ? ` <span style="color:var(--sub);font-weight:700">(${esc(t)})</span>` : ''}</div></div>`; }).join('')
          : '<p class="perfil">Busca su primera oportunidad laboral. Persona responsable, puntual y con muchas ganas de aprender.</p>'}
      </div></div>
      <div class="card"><div class="pad"><div class="titulo"><span>🎓</span><h2>Estudios</h2></div>
        ${ests.length ? ests.map(e => `<div class="item"><h3>${esc(bonito(e.titulo) || e.nivel || 'Estudio')}</h3><div class="de">${esc(bonito(e.inst))}${V(e.ciudad) ? ' · ' + esc(bonito(e.ciudad)) : ''}</div>
          <div class="fecha">🎓 ${e.actual ? 'En curso <span class="actual">Estudiando</span>' : esc(/^\d{4}-\d{2}-\d{2}$/.test(V(e.fin)) ? fecha(e.fin) : anio(e.fin) || '')}</div></div>`).join('') : '<p class="perfil">Sin estudios registrados.</p>'}
      </div></div>
      ${refs.length ? `<div class="card"><div class="pad"><div class="titulo"><span>🤝</span><h2>Referencias</h2></div>
        <div class="chips" style="margin-top:6px">${refs.map(r => `<span class="chip">${esc(bonito(r.nombre))}${V(r.prof) ? ' · ' + esc(bonito(r.prof)) : ''}</span>`).join('')}</div>
        <p class="nota">📄 Los teléfonos de las referencias están en la hoja de vida en Word.</p></div></div>` : ''}
    </div>
  </div>
  <p class="pie">Hoja de vida publicada por <b>${esc(neg)}</b> · actualizada el ${esc(fecha(D.actualizado))}<br>Solo la ve quien tiene este enlace.</p>`;
  const b = document.getElementById('bajar'), t0 = b.textContent;
  b.onclick = async () => {
    b.disabled = true; b.textContent = '⏳ Preparando tu Word…';
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ perfil: token }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'No se pudo generar'); }
      const blob = await r.blob(), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = 'hoja-de-vida-' + nombre.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '-').toLowerCase() + '.docx';
      document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
      const n = document.getElementById('aviso'); if (n) n.remove();
      b.textContent = '✅ Descargada'; setTimeout(() => { b.textContent = t0; b.disabled = false; }, 2500);
    } catch (e) { b.textContent = t0; b.disabled = false; alertar(e.message); }
  };
}

function alertar(m) { let n = document.getElementById('aviso'); if (!n) { n = document.createElement('p'); n.id = 'aviso'; n.className = 'nota'; n.style.background = '#fde1e5'; document.getElementById('bajar').after(n); } n.textContent = '⚠️ ' + m; }

if (!token || token.length < 20) error('Enlace incompleto', 'Revisa que hayas copiado el enlace completo que te enviaron.');
else rpc('cj_hv_publica', { p_link: token }).then(pinta).catch(e => error('No disponible', e.message));
})();
</script>
</body>
</html>
